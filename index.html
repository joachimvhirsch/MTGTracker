<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">

  <link rel="stylesheet" href="styles.css?v=20261009a">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try { var t = JSON.parse(localStorage.getItem('mtg.theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>

  <div id="loadbar" aria-hidden="true"></div>
  </div>
